<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>2048 Game</title>
</head>
<body>
    <div class="game-container">
        <h1>2048</h1>
        <div class="grid" id="grid"></div>
        <button id="restartButton">Начать заново</button>
        <div class="score">Счет: <span id="score">0</span></div>

        <!-- Кнопки для управления -->
        <div class="controls">
            <button class="control" id="up">^</button>
            <div>
                <button class="control" id="left"><</button>
                <button class="control" id="right">></button>
            </div>
            <button class="control" id="down">v</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
